name: Governance checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotmac-governance-seabone-ci
  cancel-in-progress: true

jobs:
  records:
    name: Governance record validation
    # The Seabone runner is a host, not a disposable container, and a fork pull
    # request must never reach it. Keeping this repository private is the
    # control that achieves that (ADR 0003); this guard is a backstop, not a
    # barrier. It cannot be relied on against a hostile fork: a pull_request
    # workflow runs the definition produced by merging the head into the base,
    # and a fork controls its head, so it can delete this condition. It defends
    # against an accidental fork pull request and against a run approved
    # without close reading.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, seabone, dotmac-governance]
    timeout-minutes: 10
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the validation runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Exercise known-good and known-bad controls
        run: python -m unittest discover --start-directory tests --verbose

      - name: Validate governance records
        run: python tools/check_adrs.py
