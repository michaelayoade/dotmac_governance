name: Governance checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  adr:
    name: ADR numbering and status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ADRs
        run: python3 tools/check_adrs.py
