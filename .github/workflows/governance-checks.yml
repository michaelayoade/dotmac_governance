name: Governance checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  records:
    name: Governance record validation
    # Public pull-request code runs only on GitHub's disposable hosted runner.
    # No repository-scoped host, production route or long-lived credential is
    # available to the job. The all_external_contributors approval setting is
    # still verified separately; this file does not claim to enforce it.
    # No concurrency group is used, so this workflow cannot cancel an older run
    # merely because a later ref entered the same repository-level group.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, deliberately. The receipt registry's append-only arm and
      # the commit-identity guard both compare against a base commit, and both
      # FAIL CLOSED when it is unreachable. A shallow clone would turn a real
      # control into a red build for the wrong reason.
      - name: Check out the evaluated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the validation runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned development validators
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check control-plane lint and formatting
        run: |
          python3 -m ruff check --select E4,E7,E9,F,I,B,UP agent_control gate_control kernel_adoption_control programme_control standards_control tests/test_agent_control.py tests/test_check_adr_references.py tests/test_check_commit_identity.py tests/test_check_local_action_workspace.py tests/test_check_receipts.py tests/test_check_validation_contract.py tests/test_gate_control.py tests/test_kernel_adoption_control.py tests/test_programme_control.py tests/test_standards_control.py tools/check_adr_references.py tools/check_commit_identity.py tools/check_local_action_workspace.py tools/check_receipts.py tools/check_validation_contract.py tools/dotmac-agent tools/dotmac-gates tools/dotmac-programme tools/dotmac-standards
          python3 -m ruff format --check agent_control gate_control kernel_adoption_control programme_control standards_control tests/test_agent_control.py tests/test_check_adr_references.py tests/test_check_commit_identity.py tests/test_check_local_action_workspace.py tests/test_check_receipts.py tests/test_check_validation_contract.py tests/test_gate_control.py tests/test_kernel_adoption_control.py tests/test_programme_control.py tests/test_standards_control.py tools/check_adr_references.py tools/check_commit_identity.py tools/check_local_action_workspace.py tools/check_receipts.py tools/check_validation_contract.py tools/dotmac-agent tools/dotmac-gates tools/dotmac-programme tools/dotmac-standards

      - name: Check typed control-plane boundaries
        run: python3 -m mypy --strict --scripts-are-modules agent_control gate_control kernel_adoption_control programme_control standards_control tools/check_adr_references.py tools/check_commit_identity.py tools/check_local_action_workspace.py tools/check_receipts.py tools/check_validation_contract.py tools/dotmac-agent tools/dotmac-gates tools/dotmac-programme tools/dotmac-standards

      - name: Exercise known-good and known-bad controls
        run: python3 -m unittest discover --start-directory tests --verbose

      - name: Validate governance records
        run: python3 tools/check_adrs.py

      # Every ADR citation this repository makes must resolve in this
      # repository, or name the one that owns it (ADR 0031). Scoped to THIS
      # repository's own text: propagating it to an enrolled repository is a
      # separate decision, because it would turn
      # `dotmac_platform_control_plane` red on 43 pre-existing citations before
      # that repository's own sweep has landed.
      - name: Validate ADR citations
        run: python3 tools/check_adr_references.py

      # Author, committer and attribution trailers on the commits this branch
      # ADDS. Not on history: a guard over history would be permanently red on
      # a repository that already has the problem, and a permanently red guard
      # is switched off. Both endpoints are passed explicitly, and an
      # unestablishable range FAILS — a guard that goes green when it cannot
      # determine what to inspect does so exactly when something is unusual.
      #
      # One line, deliberately. A folded (`>-`) scalar does NOT fold a
      # more-indented line, so an expression wrapped for readability became a
      # second shell command -- and the step still reported the first half's
      # success. That is this guard's own failure mode arriving in its own
      # wiring, which is why `main` now refuses an argument it does not
      # recognise instead of quietly falling back to a default.
      - name: Check commit author, committer and attribution trailers
        run: python3 tools/check_commit_identity.py --base ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }} --head ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      # The base is passed EXPLICITLY rather than inferred. On a pull request
      # the checkout is the merge commit, so "HEAD's parent" is ambiguous, and
      # a guard that guesses its own baseline is a guard whose baseline nobody
      # reviewed. An unresolvable base fails the step; it never passes.
      - name: Validate the authority-cutover receipt registry
        run: >-
          python3 tools/check_receipts.py --base
          ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before }}

      # A local action resolves against $GITHUB_WORKSPACE, so a job that has
      # checked out a caller-supplied ref into the workspace ROOT supplies its
      # own action's code from that ref (ADR 0044). Scoped to THIS repository's
      # workflows: propagating it to the enrolled estate is open decision 51.
      # The check covers ONLY that mechanism -- not `run:` scripts, not
      # plugins, not build backends -- and its success line says so, because a
      # narrow check read as a broad guarantee is worse than an absent one.
      - name: Check local actions against the workspace root they resolve from
        run: python3 tools/check_local_action_workspace.py

      # The instructions and this file are the two halves of "what must pass".
      # They drifted once already, in both directions at the same time. This
      # step fails if either half moves without the declaration they now share.
      - name: Validate the local and CI validation contract
        run: python3 tools/check_validation_contract.py

      - name: Validate cross-repository programme matrices
        run: python3 -m programme_control --root .

      # The half the step above cannot do. A `no_product_writer` roster claim
      # asserts a fact about another repository's dossier, so the dossier is
      # fetched at the exact revision the matrix pins — never a branch, or the
      # result would depend on when the check ran.
      #
      # Fetching a single commit by SHA needs no ref and no history; if the pin
      # is unreachable the checkout fails and the claim is never silently
      # skipped.
      - name: Check out the pinned Starter dossiers
        run: |
          set -euo pipefail
          PIN="$(python3 - <<'PY'
          import json, pathlib, sys
          pins = set()
          for path in sorted(pathlib.Path("programmes").glob("*.json")):
              matrix = json.loads(path.read_text(encoding="utf-8"))
              for record in matrix.get("records", []):
                  if record.get("role") == "module-dossier":
                      pins.add(record["revision"])
          if len(pins) != 1:
              print(f"expected exactly one pinned dossier revision, got {sorted(pins)}",
                    file=sys.stderr)
              raise SystemExit(1)
          print(pins.pop())
          PY
          )"
          rm -rf "${RUNNER_TEMP}/pinned-starter"
          mkdir -p "${RUNNER_TEMP}/pinned-starter"
          cd "${RUNNER_TEMP}/pinned-starter"
          git init -q .
          git remote add origin https://github.com/michaelayoade/dotmac_starter_mt.git
          git fetch -q --depth 1 origin "$PIN"
          git checkout -q FETCH_HEAD
          echo "pinned Starter at $PIN"

      - name: Check roster writer claims against the pinned dossiers
        run: >-
          python3 -m programme_control --root .
          --starter-checkout "${RUNNER_TEMP}/pinned-starter"

      - name: Validate the agent-control pilot profile
        run: python3 -m agent_control verify --root . --profile .dotmac/agent-profile.json

      - name: Validate the required engineering standards profile
        uses: ./.github/actions/standards-check
        with:
          default-branch: ${{ github.event.repository.default_branch }}
