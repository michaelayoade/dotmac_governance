name: Governance checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dotmac-governance-seabone-ci
  cancel-in-progress: true

jobs:
  records:
    name: Governance record validation
    # The Seabone runner is a host, not a disposable container. On a public
    # repository a fork pull request must never reach it. GitHub's Actions
    # approval setting is the primary control; this guard is the one that
    # survives that setting being changed, and it cannot be toggled without a
    # reviewed change to this file. A fork pull request therefore runs no
    # validation and cannot satisfy the required check — deliberate, for a
    # repository where every merge is a governance act.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, seabone, dotmac-governance]
    timeout-minutes: 10
    steps:
      - name: Check out the evaluated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the validation runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned development validators
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check control-plane lint and formatting
        run: |
          python3 -m ruff check --select E4,E7,E9,F,I,B,UP agent_control gate_control programme_control standards_control tests/test_agent_control.py tests/test_check_validation_contract.py tests/test_gate_control.py tests/test_programme_control.py tests/test_standards_control.py tools/check_validation_contract.py tools/dotmac-agent tools/dotmac-gates tools/dotmac-programme tools/dotmac-standards
          python3 -m ruff format --check agent_control gate_control programme_control standards_control tests/test_agent_control.py tests/test_check_validation_contract.py tests/test_gate_control.py tests/test_programme_control.py tests/test_standards_control.py tools/check_validation_contract.py tools/dotmac-agent tools/dotmac-gates tools/dotmac-programme tools/dotmac-standards

      - name: Check typed control-plane boundaries
        run: python3 -m mypy --strict --scripts-are-modules agent_control gate_control programme_control standards_control tools/check_validation_contract.py tools/dotmac-agent tools/dotmac-gates tools/dotmac-programme tools/dotmac-standards

      - name: Exercise known-good and known-bad controls
        run: python3 -m unittest discover --start-directory tests --verbose

      - name: Validate governance records
        run: python3 tools/check_adrs.py

      # The instructions and this file are the two halves of "what must pass".
      # They drifted once already, in both directions at the same time. This
      # step fails if either half moves without the declaration they now share.
      - name: Validate the local and CI validation contract
        run: python3 tools/check_validation_contract.py

      - name: Validate cross-repository programme matrices
        run: python3 -m programme_control --root .

      # The half the step above cannot do. A `no_product_writer` roster claim
      # asserts a fact about another repository's dossier, so the dossier is
      # fetched at the exact revision the matrix pins — never a branch, or the
      # result would depend on when the check ran.
      #
      # Fetching a single commit by SHA needs no ref and no history; if the pin
      # is unreachable the checkout fails and the claim is never silently
      # skipped.
      - name: Check out the pinned Starter dossiers
        run: |
          set -euo pipefail
          PIN="$(python3 - <<'PY'
          import json, pathlib, sys
          pins = set()
          for path in sorted(pathlib.Path("programmes").glob("*.json")):
              matrix = json.loads(path.read_text(encoding="utf-8"))
              for record in matrix.get("records", []):
                  if record.get("role") == "module-dossier":
                      pins.add(record["revision"])
          if len(pins) != 1:
              print(f"expected exactly one pinned dossier revision, got {sorted(pins)}",
                    file=sys.stderr)
              raise SystemExit(1)
          print(pins.pop())
          PY
          )"
          rm -rf "${RUNNER_TEMP}/pinned-starter"
          mkdir -p "${RUNNER_TEMP}/pinned-starter"
          cd "${RUNNER_TEMP}/pinned-starter"
          git init -q .
          git remote add origin https://github.com/michaelayoade/dotmac_starter_mt.git
          git fetch -q --depth 1 origin "$PIN"
          git checkout -q FETCH_HEAD
          echo "pinned Starter at $PIN"

      - name: Check roster writer claims against the pinned dossiers
        run: >-
          python3 -m programme_control --root .
          --starter-checkout "${RUNNER_TEMP}/pinned-starter"

      - name: Validate the agent-control pilot profile
        run: python3 -m agent_control verify --root . --profile .dotmac/agent-profile.json

      - name: Validate the required engineering standards profile
        uses: ./.github/actions/standards-check
        with:
          default-branch: ${{ github.event.repository.default_branch }}
